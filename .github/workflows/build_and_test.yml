name: Build and test
on:
  push:
    paths:
      - '**.yml'
      - '**.toml'
      - '**.py'
      - '**.json'
      - '**.R'
      - '**.RData'
      - '**.csv'
      - '**.pkl'
      - '**.lock'
  pull_request:
    paths:
      - '**.yml'
      - '**.toml'
      - '**.py'
      - '**.json'
      - '**.R'
      - '**.RData'
      - '**.csv'
      - '**.pkl'
      - '**.lock'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv using Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: uv sync --extra dev
      - name: Test
        working-directory: ./
        run: |
          uv run python -m pytest -m "not local and not needs_puf and not needs_tmd" --cov=./ --cov-report=xml
        env:
          # Map the GitHub secret to an environment variable for pytest
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && contains(github.repository, 'PSLmodels/OG-USA')
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
